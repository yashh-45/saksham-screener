services:
  - type: web
    name: saksham-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODEL_PATH
        value: ../model_output/saksham_model.pth
      - key: METADATA_PATH
        value: ../model_output/model_metadata.json
      - key: PYTHON_VERSION
        value: "3.11.0"
    healthCheckPath: /
